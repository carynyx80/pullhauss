[package]
name = "pullhaus"
version = "0.1.0"
description = "pullhaus: extras on top of Helius Solana Privacy Rings"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pullhaus"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
solana-keccak-hasher = "2.2"
